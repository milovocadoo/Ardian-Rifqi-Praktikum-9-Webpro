<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 40px; color: #222; }
        .container { max-width: 450px; background: #ffffff; padding: 25px 30px; border: 1px solid #e0e0e0; border-radius: 6px; }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label.title { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .checkbox-group label { display: block; margin-bottom: 5px; font-size: 14px; cursor: pointer; }
        button { background-color: #007bff; color: white; border: none; padding: 9px 18px; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #0069d9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Data Diri</h2>
    <!-- Mengirim data dengan metode POST ke file proses -->
    <form action="proses_data_diri.php" method="POST">
        <div class="form-group">
            <label for="nama" class="title">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
        </div>
        <div class="form-group">
            <label for="tgl_lahir" class="title">Tanggal Lahir:</label>
            <input type="date" id="tgl_lahir" name="tgl_lahir" required>
        </div>
        <div class="form-group">
            <label class="title">Hobi:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>
        </div>
        <button type="submit">Kirim</button>
    </form>
</div>

</body>
</html>
